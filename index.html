<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi hermosa ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000000;
        font-family: Georgia, serif;
        overflow-x: hidden;
        padding: 30px 10px;
    }

    .contenedor {
        text-align: center;
        width: 100%;
        max-width: 600px;
    }

    h1 {
        color: #ff1744;
        font-size: clamp(27px, 5vw, 42px);
        margin-bottom: 20px;
        text-shadow: 0 0 15px #ff003c;
        animation: latido 1.5s infinite;
    }

    .corazon {
        width: min(95vw, 500px);
        height: min(80vw, 420px);
        margin: 0 auto;
        filter: drop-shadow(0 0 12px #ff003c);
        cursor: pointer;
    }

    .palabras {
        color: #ff1744;
        font-family: Arial, sans-serif;
        font-size: 15px;
        font-weight: bold;
        line-height: 1.15;
        overflow-wrap: anywhere;
        text-shadow: 0 0 5px #ff1744;
    }

    /* Cada frase empieza oculta y aparece una por una */
    .palabras .frase {
        opacity: 0;
        display: inline;
    }

    .palabras .frase.visible {
        animation: aparecer 0.6s ease-out forwards;
    }

    .palabras.completo {
        animation: brillo 2s infinite alternate;
    }

    .mensaje,
    .decoracion {
        opacity: 0;
        transition: opacity 1.8s ease;
    }

    .mensaje.visible,
    .decoracion.visible {
        opacity: 1;
    }

    .mensaje {
        color: #ffffff;
        font-size: clamp(17px, 4vw, 23px);
        line-height: 1.7;
        margin: 20px auto;
        max-width: 500px;
        text-shadow: 0 0 8px #ff1744;
    }

    .mensaje span {
        color: #ff1744;
        font-weight: bold;
    }

    .decoracion {
        color: #ff1744;
        font-size: 25px;
        margin-top: 12px;
        letter-spacing: 8px;
    }

    @keyframes aparecer {
        0%   { opacity: 0; color: #ffffff; text-shadow: 0 0 14px #ffffff; }
        60%  { opacity: 1; color: #ff8aa1; text-shadow: 0 0 12px #ff1744; }
        100% { opacity: 1; color: #ff1744; text-shadow: 0 0 5px #ff1744; }
    }

    @keyframes latido {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
    }

    @keyframes brillo {
        from { opacity: 0.7; }
        to {
            opacity: 1;
            text-shadow: 0 0 12px #ff1744;
        }
    }
</style>
</head>

<body>

<div class="contenedor">

    <h1>Para ti, mi hermosa ❤️</h1>

    <div class="corazon" id="corazon" title="Toca para repetir">
        <svg viewBox="0 0 500 420"
             width="100%" height="100%"
             xmlns="http://www.w3.org/2000/svg">

            <defs>
                <clipPath id="formaCorazon">
                    <path d="M250 390
                    C210 350 30 230 30 130
                    C30 30 160 0 250 100
                    C340 0 470 30 470 130
                    C470 230 290 350 250 390 Z"/>
                </clipPath>
            </defs>

            <foreignObject x="0" y="0"
                           width="500" height="420"
                           clip-path="url(#formaCorazon)">
                <div xmlns="http://www.w3.org/1999/xhtml"
                     class="palabras" id="texto"></div>
            </foreignObject>
        </svg>
    </div>

    <p class="mensaje" id="mensaje">
        La palabra pesa menos que mi sentimiento,
        gracias por estos <span>2 meses</span>, hermosa.
        <br />
        <span>Más de lo que las palabras pueden expresar.</span>
    </p>

    <div class="decoracion" id="decoracion">♥ ♥ ♥</div>

</div>

<script>
    const idiomas = [
        "TE AMO",
        "I LOVE YOU",
        "JE T'AIME",
        "TI AMO",
        "ICH LIEBE DICH",
        "愛してる",
        "사랑해",
        "EU TE AMO",
        "Я ТЕБЯ ЛЮБЛЮ",
        "TE QUIERO",
        "MON AMOUR",
        "SARANGHAE",
        "WO AI NI",
        "ANA BAHEBAK",
        "IK HOU VAN JOU",
        "I LOVE YOU",
        "TE AMO",
        "JE T'AIME"
    ];

    const LINEAS = 27;
    const FRASES_POR_LINEA = 5;
    const INTERVALO_MS = 70;   // tiempo entre una frase y la siguiente

    const texto = document.getElementById("texto");
    const mensaje = document.getElementById("mensaje");
    const decoracion = document.getElementById("decoracion");
    let temporizador = null;

    function mezclar(lista) {
        for (let i = lista.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [lista[i], lista[j]] = [lista[j], lista[i]];
        }
        return lista;
    }

    function construir() {
        texto.innerHTML = "";
        const frases = [];

        for (let i = 0; i < LINEAS; i++) {
            const linea = document.createElement("div");

            for (let j = 0; j < FRASES_POR_LINEA; j++) {
                const span = document.createElement("span");
                span.className = "frase";
                span.textContent =
                    idiomas[Math.floor(Math.random() * idiomas.length)] + " ♥ ";
                linea.appendChild(span);
                frases.push(span);
            }

            texto.appendChild(linea);
        }

        return frases;
    }

    function iniciar() {
        clearInterval(temporizador);
        texto.classList.remove("completo");
        mensaje.classList.remove("visible");
        decoracion.classList.remove("visible");

        // Las frases ocupan su lugar desde el inicio (el corazón ya
        // tiene su forma) pero están invisibles hasta que les toca.
        const orden = mezclar(construir());
        let indice = 0;

        temporizador = setInterval(() => {
            if (indice < orden.length) {
                orden[indice].classList.add("visible");
                indice++;
            } else {
                clearInterval(temporizador);
                texto.classList.add("completo");
                mensaje.classList.add("visible");
                setTimeout(() => decoracion.classList.add("visible"), 900);
            }
        }, INTERVALO_MS);
    }

    iniciar();

    // Toca el corazón para verlo formarse de nuevo
    document.getElementById("corazon").addEventListener("click", iniciar);
</script>

</body>
</html>
