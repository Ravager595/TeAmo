
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi hermosa ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000000;
        font-family: Georgia, serif;
        overflow-x: hidden;
        padding: 30px 10px;
    }

    .contenedor {
        text-align: center;
        width: 100%;
        max-width: 600px;
    }

    h1 {
        color: #ff1744;
        font-size: clamp(27px, 5vw, 42px);
        margin-bottom: 20px;
        text-shadow: 0 0 15px #ff003c;
        animation: latido 1.5s infinite;
    }

    .corazon {
        width: min(95vw, 500px);
        height: min(80vw, 420px);
        margin: 0 auto;
        filter: drop-shadow(0 0 12px #ff003c);
    }

    .palabras {
        color: #ff1744;
        font-family: Arial, sans-serif;
        font-size: 15px;
        font-weight: bold;
        line-height: 1.15;
        overflow-wrap: anywhere;
        text-shadow: 0 0 5px #ff1744;
        animation: brillo 2s infinite alternate;
    }

    .mensaje {
        color: #ffffff;
        font-size: clamp(17px, 4vw, 23px);
        line-height: 1.7;
        margin: 20px auto;
        max-width: 500px;
        text-shadow: 0 0 8px #ff1744;
    }

    .mensaje span {
        color: #ff1744;
        font-weight: bold;
    }

    .decoracion {
        color: #ff1744;
        font-size: 25px;
        margin-top: 12px;
        letter-spacing: 8px;
    }

    @keyframes latido {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
    }

    @keyframes brillo {
        from { opacity: 0.7; }
        to {
            opacity: 1;
            text-shadow: 0 0 12px #ff1744;
        }
    }
</style>
</head>

<body>

<div class="contenedor">

    <h1>Para ti, mi hermosa ❤️</h1>

    <div class="corazon">
        <svg viewBox="0 0 500 420"
             width="100%" height="100%"
             xmlns="http://www.w3.org/2000/svg">

            <defs>
                <clipPath id="formaCorazon">
                    <path d="M250 390
                    C210 350 30 230 30 130
                    C30 30 160 0 250 100
                    C340 0 470 30 470 130
                    C470 230 290 350 250 390 Z"/>
                </clipPath>
            </defs>

            <foreignObject x="0" y="0"
                           width="500" height="420"
                           clip-path="url(#formaCorazon)">
                <div xmlns="http://www.w3.org/1999/xhtml"
                     class="palabras" id="texto"></div>
            </foreignObject>
        </svg>
    </div>

    <p class="mensaje">
        La palabra pesa menos que mi sentimiento,
        gracias por estos <span>2 meses</span>, hermosa.
        <br />
        <span>Te amo más de lo que las palabras pueden expresar. ❤️</span>
    </p>

    <div class="decoracion">♥ ♥ ♥</div>

</div>

<script>
    const idiomas = [
        "TE AMO",
        "I LOVE YOU",
        "JE T'AIME",
        "TI AMO",
        "ICH LIEBE DICH",
        "愛してる",
        "사랑해",
        "EU TE AMO",
        "Я ТЕБЯ ЛЮБЛЮ",
        "TE QUIERO",
        "MON AMOUR",
        "SARANGHAE",
        "WO AI NI",
        "ANA BAHEBAK",
        "IK HOU VAN JOU",
        "I LOVE YOU",
        "TE AMO",
        "JE T'AIME"
    ];

    const texto = document.getElementById("texto");

    for (let i = 0; i < 27; i++) {
        const linea = document.createElement("div");

        for (let j = 0; j < 5; j++) {
            linea.textContent +=
                idiomas[Math.floor(Math.random() * idiomas.length)]
                + " ♥ ";
        }

        texto.appendChild(linea);
    }
</script>

</body>
</html>
