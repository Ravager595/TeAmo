
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te amo</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: radial-gradient(circle, #a00020, #3b0009);
        font-family: Arial, sans-serif;
    }

    .contenedor {
        text-align: center;
        padding: 20px;
    }

    h1 {
        color: #fff0f3;
        font-size: clamp(25px, 5vw, 42px);
        margin-bottom: 30px;
        text-shadow: 0 0 15px #ff1744;
        animation: latido 1.5s infinite;
    }

    .corazon {
        width: min(90vw, 500px);
        height: min(75vw, 420px);
        overflow: hidden;
        filter: drop-shadow(0 0 15px #ff1744);
    }

    .palabras {
        color: #ff1744;
        font-size: clamp(11px, 2vw, 16px);
        font-weight: bold;
        line-height: 1.15;
        overflow-wrap: anywhere;
        word-spacing: 5px;
        text-shadow: 0 0 5px #ff8a9e;
        animation: brillo 2s infinite alternate;
    }

    @keyframes latido {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
    }

    @keyframes brillo {
        from { opacity: 0.7; }
        to { opacity: 1; text-shadow: 0 0 12px #ff8a9e; }
    }

    .mensaje {
        color: #ffdce3;
        margin-top: 25px;
        font-size: 18px;
        letter-spacing: 2px;
    }
</style>
</head>

<body>
<div class="contenedor">
    <h1>Para ti, amor. La palabra pesa menos que mi sentimiento</h1>

    <div class="corazon">
        <svg viewBox="0 0 500 420"
             width="100%" height="100%"
             xmlns="http://www.w3.org/2000/svg">

            <defs>
                <clipPath id="formaCorazon">
                    <path d="M250 390
                    C210 350 30 230 30 130
                    C30 30 160 0 250 100
                    C340 0 470 30 470 130
                    C470 230 290 350 250 390 Z"/>
                </clipPath>
            </defs>

            <foreignObject x="0" y="0"
                           width="500" height="420"
                           clip-path="url(#formaCorazon)">
                <div xmlns="http://www.w3.org/1999/xhtml"
                     class="palabras" id="texto"></div>
            </foreignObject>
        </svg>
    </div>

    <p class="mensaje">Te amo más de lo que imaginas 💖</p>
</div>

<script>
    const idiomas = [
        "TE AMO", "I LOVE YOU", "JE T'AIME",
        "TI AMO", "ICH LIEBE DICH", "愛してる",
        "사랑해", "EU TE AMO", "Я ТЕБЯ ЛЮБЛЮ",
        "TE QUIERO", "ILY", "MON AMOUR",
        "AISHITERU", "SARANGHAE", "LOVE YOU",
        "WO AI NI", "ANA BAHEBAK", "IK HOU VAN JOU",
        "TE AMO", "I LOVE YOU", "JE T'AIME"
    ];

    const texto = document.getElementById("texto");

    for (let i = 0; i < 27; i++) {
        const linea = document.createElement("div");

        for (let j = 0; j < 5; j++) {
            linea.textContent +=
                idiomas[Math.floor(Math.random() * idiomas.length)] + " ♥ ";
        }

        texto.appendChild(linea);
    }
</script>
</body>
</html>
